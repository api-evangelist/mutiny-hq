notes: >-
  The hosted Mutiny MCP server (https://mcp.mutinyhq.com) publishes two real
  documents: RFC 8414 OAuth authorization-server metadata and RFC 9728 OAuth
  protected-resource metadata, both saved verbatim in this directory. The
  marketing, app and help hosts publish no /.well-known/ documents. Negative results
  here are trustworthy rather than SPA catch-alls: mcp.mutinyhq.com returns a
  structured JSON 404 ({"message":"Route GET:<path> not found",...}) for unknown
  paths and www.mutinyhq.com (Framer) returns a text/html "Not found" with a real 404
  status, so no host answers 200 to arbitrary /.well-known/ paths. No security.txt is
  served anywhere, so no SecurityTxt pointer is emitted; no agent card is served
  anywhere, so no a2a/ artifact is written.

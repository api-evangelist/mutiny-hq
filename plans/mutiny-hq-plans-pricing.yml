metering: >-
  Mutiny is metered in CREDITS, not API calls. Credits are fractional and priced on
  the work the agent performs — conversation/planning costs little or nothing,
  building (copy, sections, pages, routines) is priced on context in and output out.
  Credits pool across the whole workspace, unused credits roll over into the next
  month and rolled-over credits are consumed first. Admins can set per-user monthly
  caps. Clarifying questions and failed generations are not charged.

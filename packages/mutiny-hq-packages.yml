source: >-
  Registry metadata from registry.npmjs.org, crates.io and the MutinyHQ GitHub
  organization, plus the Mutiny Help Center. npm, PyPI, RubyGems, Maven Central,
  NuGet, pkg.go.dev, Packagist and crates.io were all queried for first-party
  Mutiny client libraries.
notes: >-
  Mutiny publishes no general-purpose REST API, so there is no server-side API
  client SDK family. The one first-party client library on a public registry is
  @mutinyhq/react-sdk, which wraps the LEGACY website-personalization product and
  has not shipped a release since 2023-03-27 — its source repository
  (github.com/MutinyHQ/web-sdks) now returns 404. The current programmatic entry
  point is the hosted MCP server, which needs no client library (any MCP client
  speaks to it over HTTP + OAuth). mutiny-diff/mdiff is a first-party open-source
  developer tool published by the company; it is NOT a client for the Mutiny
  product API and no CLI pointer is emitted for it.

notes: >-
  An honest zero: Mutiny publishes no request-rate limits for its MCP server and
  returns no rate-limit signalling headers on the responses that can be observed
  without a token. Consumption is governed entirely by the credit system, which is
  a billing quota rather than a runtime throttle. An agent operating through the
  Mutiny MCP has no machine-readable signal telling it how close the workspace is
  to exhausting its pool — that is the actionable gap.

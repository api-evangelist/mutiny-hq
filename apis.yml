apis:
- name: Mutiny MCP Server
  description: >-
    Mutiny's hosted Model Context Protocol server and its only public programmatic
    entry point. It exposes the workspace's asset creation, template, content library
    and publishing capabilities to any MCP-compatible client (Claude web/Desktop/Code,
    ChatGPT, IDE agents) as 12 annotated tools — 11 of which are visible to external
    clients — over streamable HTTP, protected by OAuth 2.0 authorization code with
    PKCE (S256) and RFC 7591 dynamic client registration. tools/list and initialize
    both require a token, so live tool schemas are auth-gated; the tool catalogue
    itself is published in Mutiny's own MCP reference.
  humanURL: https://help.mutinyhq.com/articles/2908744000-mutiny-model-context-protocol-mcp
  baseURL: https://mcp.mutinyhq.com/mcp
  tags:
  - MCP
  - Agents
  - Content Generation
  - Sales Enablement

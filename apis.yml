aid: mutiny-hq
name: Mutiny HQ
description: >-
  Mutiny is a GTM (go-to-market) assistant built for customer-facing work — a
  vertical AI platform for B2B revenue teams (used by Snowflake, Uber, Rippling,
  GitLab, and Figma). It generates on-brand customer-facing assets such as deal
  rooms, pitch decks, business cases, ABM campaigns, comparison pages, and
  meeting recaps, and automates repetitive sales and marketing workflows through
  an agent, skill, and routine framework. Mutiny integrates with common CRM and
  GTM systems (Salesforce, HubSpot, Marketo, 6sense, Segment) and exposes a
  hosted Model Context Protocol (MCP) server so agents like Claude and ChatGPT
  can create, browse, and publish assets in conversation. Mutiny is backed by
  Insight Partners. It does not publish a general-purpose REST API; its
  programmatic entry point is the OAuth-protected MCP server.
